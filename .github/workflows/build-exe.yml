name: Build Tokguard Windows EXE

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build single-file executable
        run: |
          pyinstaller --onefile --noconsole --name Tokguard --collect-all tiktoken --hidden-import tiktoken_ext.openai_public main.py

      - name: Upload Tokguard.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tokguard-Windows-x64
          path: dist/Tokguard.exe

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Tokguard.exe
          generate_release_notes: true
